# The `web-search` agent preset: a basic web chat with a single tool.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed. Only the web-search tool is mounted, so the
# agent behaves like a normal web chat and can look things up on the web; no
# other tools are available.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a helpful assistant. You can use the web_search tool to find
      current or factual information from the web; use it when a question needs
      up-to-date or factual grounding, and otherwise answer directly and
      conversationally.
    complete: true
    includeRuntimeContext: false

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. `fetch: false` keeps search-only access
# (no page fetching), matching a search-only chat.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
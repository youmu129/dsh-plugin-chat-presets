# The `pure-chat` agent preset: a bare conversation-only composition.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed, and no model-facing tools are mounted — the
# agent only converses.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a helpful assistant.
    complete: true
    includeRuntimeContext: false
